<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTV 360 — Ribbon Pairing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/brand.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to menu</a>

  <main class="scene">
    <div class="ribbon ribbon--top"></div>
    <div class="ribbon ribbon--bottom"></div>

    <div class="content">
      <img class="wordmark" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />

      <section class="card glass">
        <div class="card-top">
          <div class="card-left">
            <p class="label">Enter this code in your dashboard</p>
            <p class="code" id="pairing-code">GCZX4Y</p>
            <p class="timestamp" id="pairing-timestamp">11:00 AM &middot; July 30, 2026</p>
          </div>

          <div class="card-right">
            <div class="qr-tile">
              <img id="pairing-qr" alt="QR code to pair this player" width="180" height="180" />
            </div>
            <p class="qr-caption">Or scan to pair</p>
          </div>
        </div>

        <div class="divider"></div>

        <div class="status-row">
          <span class="dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Player is online</span>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
