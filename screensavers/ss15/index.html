<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTV 360 — Aurora Glow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/brand.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to menu</a>

  <main class="scene">
    <div class="gradient-background">
      <div class="gradient-sphere sphere-1"></div>
      <div class="gradient-sphere sphere-2"></div>
      <div class="gradient-sphere sphere-3"></div>
      <div class="glow"></div>
      <div class="grid-overlay"></div>
      <div class="particles-container" id="particles"></div>
    </div>

    <span class="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Player is online</span>
    </span>

    <div class="content-container">
      <img class="wordmark" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />
      <h1 class="headline">Pair this display</h1>
      <p class="instruction">Enter this code in your dashboard</p>

      <section class="ticket glass">
        <p class="ticket__code" id="pairing-code">GCZX4Y</p>
        <div class="ticket__divider"></div>
        <div class="ticket__foot">
          <div class="ticket__qr">
            <img id="pairing-qr" alt="QR code to pair this player" width="120" height="120" />
          </div>
          <div class="ticket__meta">
            <span class="ticket__meta-label">Or scan to pair</span>
            <span class="ticket__timestamp" id="pairing-timestamp">11:00 AM &middot; July 30, 2026</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
