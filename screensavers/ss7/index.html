<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV 360 — Navy Focus</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #00263E; overflow: hidden; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #FDFDFD; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }
  .canvas { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: top left; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="canvas" id="canvas">
  <div style="width: 1280px; height: 720px; background: radial-gradient(circle at 18% 22%, rgba(160,5,88,0.35), transparent 45%), radial-gradient(circle at 84% 78%, rgba(241,128,41,0.28), transparent 50%), #00263E; position: relative; overflow: hidden; display: flex; flex-direction: column; color: #FDFDFD;">
    <div style="position: relative; flex: 1; padding: 52px 64px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: 30px; width: auto;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.18em; color: rgba(253,253,253,0.6);" id="clock">5:51 PM</span>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 34px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84;"></span>
          <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: rgba(253,253,253,0.7);">Awaiting pairing</span>
        </div>

        <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; color: #FDFDFD;">Enter this code to link your display</h1>

        <div style="display: flex; gap: 14px;">
          <div style="width: 78px; height: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">9</div>
          <div style="width: 78px; height: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">P</div>
          <div style="width: 78px; height: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">L</div>
          <div style="width: 78px; height: 96px; border-radius: 12px; background: linear-gradient(135deg, #A00558, #EF060F 55%, #F18029); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">3</div>
          <div style="width: 78px; height: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">X</div>
          <div style="width: 78px; height: 96px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;">Q</div>
        </div>

        <p style="margin: 0; font-size: 15px; color: rgba(253,253,253,0.55); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em;">
          dashboard.ntv360.com &rarr; Screens &rarr; Add a display
        </p>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 18px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(253,253,253,0.5);">Display ID &middot; NTV-2201</span>
        <span style="font-size: 13px; color: rgba(253,253,253,0.5);">Code refreshes in 4:47</span>
      </div>
    </div>
  </div>
</div>
<script>
function fitCanvas() {
  var c = document.getElementById('canvas');
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var l = (window.innerWidth - 1280 * s) / 2;
  var t = (window.innerHeight - 720 * s) / 2;
  c.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
