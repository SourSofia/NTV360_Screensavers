<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NTV360 — Pair This Screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #00263e;
    --navy-dark: #020b14;
    --violet: #a00558;
    --red: #ef060f;
    --orange: #f18029;
    --white: #ffffff;
    --muted: #94a3b8;
    --bg: #030712;
    --card-bg: rgba(10, 20, 34, 0.75);
    --card-border: rgba(255, 255, 255, 0.12);
    --brand-gradient: linear-gradient(135deg, var(--red) 0%, var(--orange) 50%, var(--violet) 100%);
    --brand-gradient-horizontal: linear-gradient(90deg, var(--red), var(--orange), var(--violet));
    --glow-orange: rgba(241, 128, 41, 0.45);
    --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background-color: var(--bg);
    color: var(--white);
    font-family: var(--font-main);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Background Ambient Dynamic Canvas */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Ambient Glowing Orbs */
  .aurora {
    position: fixed;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.45;
    z-index: 0;
    pointer-events: none;
    animation: floatAurora 24s ease-in-out infinite alternate;
  }

  .aurora-1 {
    top: -25%;
    right: 20%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, var(--orange) 0%, rgba(241, 128, 41, 0) 70%);
  }

  .aurora-2 {
    bottom: -25%;
    left: 15%;
    width: 65vw;
    height: 65vw;
    background: radial-gradient(circle, var(--violet) 0%, rgba(160, 5, 88, 0) 70%);
    animation-delay: -12s;
  }

  @keyframes floatAurora {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 50px) scale(1.06); }
    100% { transform: translate(50px, -40px) scale(0.95); }
  }

  /* Screen Viewport with Burn-In Protection Shift */
  .screen {
    position: relative;
    z-index: 10;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(2rem, 4.5vh, 3.5rem) clamp(3rem, 5vw, 5rem);
    transition: transform 15s ease-in-out;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    font-size: clamp(2rem, 3vw, 2.8rem);
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .logo-mark {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--brand-gradient);
    display: grid;
    place-items: center;
    box-shadow: 0 0 28px var(--glow-orange);
  }

  .logo-mark svg {
    width: 28px;
    height: 28px;
    fill: white;
  }

  .logo .ntv {
    background: var(--brand-gradient-horizontal);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo .num {
    color: var(--white);
    font-weight: 800;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1.3rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #e2e8f0;
  }

  .status .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 14px var(--orange);
    animation: pulseGlow 2s infinite ease-in-out;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 14px var(--orange); }
    50% { transform: scale(1.35); opacity: 0.5; box-shadow: 0 0 6px var(--orange); }
  }

  /* Centered Main Focal Hero Area */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.5rem;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }

  .eyebrow {
    font-family: var(--font-mono);
    color: var(--orange);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    background: rgba(241, 128, 41, 0.12);
    border: 1px solid rgba(241, 128, 41, 0.3);
    padding: 0.45rem 1.2rem;
    border-radius: 8px;
  }

  .instruction {
    font-size: clamp(1.8rem, 3.2vw, 2.6rem);
    color: #cbd5e1;
    font-weight: 400;
    line-height: 1.2;
  }

  .instruction b {
    color: var(--white);
    font-weight: 800;
  }

  .instruction span {
    background: var(--brand-gradient-horizontal);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }

  /* Gigantic Pairing PIN Container */
  .code-wrapper {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border-radius: 36px;
    padding: clamp(2rem, 4vw, 3rem) clamp(2.5rem, 5vw, 4rem);
    box-shadow: 0 40px 110px -20px rgba(0, 0, 0, 0.85),
                0 0 90px -20px var(--glow-orange);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.8rem;
    margin: 0.5rem 0;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .code-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--orange), var(--red), transparent);
  }

  .code {
    display: flex;
    justify-content: center;
    gap: clamp(0.8rem, 2vw, 1.6rem);
    width: 100%;
  }

  .code-digit-box {
    width: clamp(6.5rem, 13vw, 11rem);
    height: clamp(8rem, 16vw, 13.5rem);
    background: linear-gradient(180deg, rgba(16, 32, 52, 0.95) 0%, rgba(3, 11, 20, 0.98) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    border-bottom: 5px solid var(--orange);
    border-radius: 24px;
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(4.5rem, 9.5vw, 8.5rem);
    color: var(--white);
    box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7);
    position: relative;
    overflow: hidden;
  }

  .code-digit-box::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, transparent 100%);
    pointer-events: none;
  }

  .code-digit-box.flip {
    animation: flipDigit 0.5s ease-out;
  }

  @keyframes flipDigit {
    0% { transform: rotateX(0deg); opacity: 1; }
    50% { transform: rotateX(90deg); opacity: 0.3; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }

  /* Scan & Sub Bar */
  .code-footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .qr-mini-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    text-align: left;
  }

  .qr-box {
    width: 60px;
    height: 60px;
    background: var(--white);
    border-radius: 12px;
    padding: 4px;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    flex-shrink: 0;
  }

  .qr-box svg {
    width: 100%;
    height: 100%;
  }

  .qr-text h4 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--white);
  }

  .qr-text p {
    font-size: 0.85rem;
    color: var(--muted);
  }

  .timer-box {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: rgba(0, 0, 0, 0.45);
    padding: 0.5rem 1.2rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .timer-svg {
    width: 20px;
    height: 20px;
    transform: rotate(-90deg);
  }

  .timer-circle-bg {
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 3;
    fill: none;
  }

  .timer-circle-progress {
    stroke: var(--orange);
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 56.5;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-label {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 700;
  }

  /* Horizontal Steps Bar at Bottom */
  .steps {
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 4vw, 4rem);
    width: 100%;
    margin-bottom: 0.5rem;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    color: #e2e8f0;
    font-size: clamp(1rem, 1.4vw, 1.25rem);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 0.8rem 1.4rem;
    border-radius: 18px;
    backdrop-filter: blur(14px);
  }

  .step .badge {
    width: 2.2rem;
    height: 2.2rem;
    border-radius: 50%;
    background: var(--brand-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: 800;
    font-size: 1.05rem;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--glow-orange);
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding-top: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--muted);
    font-size: 1.05rem;
  }

  footer .domain {
    color: var(--orange);
    font-weight: 700;
  }

  footer .clock {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--white);
  }
</style>
</head>
<body>

  <a href="../../index.html" style="position:fixed;top:16px;left:16px;z-index:100;color:#fff;opacity:0.6;text-decoration:none;font-size:14px;font-weight:600;font-family:var(--font-main);">&larr; Back to menu</a>

  <!-- Dynamic Canvas Background Particles -->
  <canvas id="bg-canvas"></canvas>
  
  <!-- Glowing Ambient Background Orbs -->
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>

  <!-- Screen Viewport -->
  <div class="screen" id="viewport">
    
    <!-- TV Header -->
    <header>
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <div><span class="ntv">NTV</span><span class="num">360</span></div>
      </div>

      <div class="status">
        <span class="dot"></span>
        <span>Online — Awaiting Pairing</span>
      </div>
    </header>

    <!-- Centered Hero Display -->
    <main>
      <div class="eyebrow">PAIR THIS SCREEN</div>
      <div class="instruction">Visit <span>dashboard.ntv360.com</span> and enter</div>

      <!-- High Visibility Code Container -->
      <div class="code-wrapper">
        <div class="code" id="codeDisplay">
          <!-- Rendered via JS -->
        </div>

        <div class="code-footer-bar">
          <div class="qr-mini-card">
            <div class="qr-box" id="qr-container">
              <!-- Rendered via JS -->
            </div>
            <div class="qr-text">
              <h4>Scan to Pair</h4>
              <p>Point phone camera at screen</p>
            </div>
          </div>

          <div class="timer-box">
            <svg class="timer-svg" viewBox="0 0 24 24">
              <circle class="timer-circle-bg" cx="12" cy="12" r="9"/>
              <circle class="timer-circle-progress" id="timer-progress" cx="12" cy="12" r="9"/>
            </svg>
            <span class="timer-label" id="timer-label">03:00</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Steps Timeline -->
    <div class="steps">
      <div class="step"><span class="badge">1</span>Sign in to dashboard</div>
      <div class="step"><span class="badge">2</span>Screens → Add Display</div>
      <div class="step"><span class="badge">3</span>Enter code above</div>
    </div>

    <!-- Footer -->
    <footer>
      <span>Control & schedule screens at <span class="domain">dashboard.ntv360.com</span></span>
      <span class="clock" id="clock">--:-- --</span>
    </footer>

  </div>

<script>
  let currentCode = "";
  const TOTAL_SECONDS = 180; // 3 minutes rotation
  let remainingSeconds = TOTAL_SECONDS;
  let timerInterval = null;

  // Generate random 6-character code
  function randomCode(len = 6) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({ length: len }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  }

  // Render 6-digit code boxes
  function renderCode(code, animate = false) {
    currentCode = code;
    const el = document.getElementById('codeDisplay');
    el.innerHTML = code.split('').map((ch, idx) =>
      `<div class="code-digit-box${animate ? ' flip' : ''}" style="animation-delay: ${idx * 0.06}s">${ch}</div>`
    ).join('');

    renderQRCode(`https://dashboard.ntv360.com/pair?code=${code}`);
  }

  // Start countdown timer
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    remainingSeconds = TOTAL_SECONDS;

    const progressCircle = document.getElementById('timer-progress');
    const timerLabel = document.getElementById('timer-label');
    const perimeter = 56.5;

    function updateTimer() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timerLabel.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const fraction = remainingSeconds / TOTAL_SECONDS;
      const offset = perimeter * (1 - fraction);
      progressCircle.style.strokeDashoffset = offset;

      if (remainingSeconds <= 0) {
        renderCode(randomCode(), true);
        remainingSeconds = TOTAL_SECONDS;
      } else {
        remainingSeconds--;
      }
    }

    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  // Live HD Clock
  function renderClock() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const dateStr = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('clock').textContent = `${dateStr} • ${timeStr}`;
  }

  // Pure SVG QR Code Generator
  function renderQRCode(url) {
    const qrContainer = document.getElementById('qr-container');
    let hash = 0;
    for (let i = 0; i < url.length; i++) hash = ((hash << 5) - hash) + url.charCodeAt(i);

    const size = 15;
    let rects = '';
    
    function isCorner(r, c) {
      return (r < 4 && c < 4) || (r < 4 && c >= size - 4) || (r >= size - 4 && c < 4);
    }

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (isCorner(r, c)) continue;
        const val = Math.abs(Math.sin(hash + r * 17 + c * 31));
        if (val > 0.45) {
          rects += `<rect x="${c}" y="${r}" width="0.88" height="0.88" rx="0.2" fill="#030712" />`;
        }
      }
    }

    const finder = (x, y) => `
      <rect x="${x}" y="${y}" width="4" height="4" fill="none" stroke="#030712" stroke-width="0.8" rx="0.5"/>
      <rect x="${x + 1}" y="${y + 1}" width="2" height="2" fill="#030712" rx="0.3"/>
    `;

    qrContainer.innerHTML = `
      <svg viewBox="0 0 ${size} ${size}">
        ${finder(0, 0)}
        ${finder(size - 4, 0)}
        ${finder(0, size - 4)}
        ${rects}
      </svg>
    `;
  }

  // Floating Ambient Canvas Particles
  function initParticleCanvas() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const count = 35;

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        radius: Math.random() * 2 + 1,
        alpha: Math.random() * 0.4 + 0.2
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < count; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(241, 128, 41, ${p.alpha})`;
        ctx.fill();

        for (let j = i + 1; j < count; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(241, 128, 41, ${0.12 * (1 - dist / 140)})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }
    animate();
  }

  // OLED Screen Burn-in Protection (Subtle 15-second Position Drift)
  function initBurnInProtection() {
    const viewport = document.getElementById('viewport');
    let step = 0;

    setInterval(() => {
      step = (step + 1) % 4;
      const offsets = [
        'translate(0px, 0px)',
        'translate(4px, -3px)',
        'translate(-3px, 4px)',
        'translate(-4px, -2px)'
      ];
      viewport.style.transform = offsets[step];
    }, 15000);
  }

  // Initial Load
  renderCode(randomCode());
  startTimer();
  renderClock();
  setInterval(renderClock, 1000);
  initParticleCanvas();
  initBurnInProtection();
</script>
</body>
</html>
