<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV 360 — Charcoal Keynote</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #231F20; overflow: hidden; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #FDFDFD; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }
  .canvas { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: top left; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="canvas" id="canvas">
  <div style="width: 1280px; height: 720px; background: #231F20; position: relative; overflow: hidden; display: flex; flex-direction: column; color: #FDFDFD;">
    <div style="position: absolute; inset: 0; background: linear-gradient(120deg, rgba(160,5,88,0.18), transparent 40%, rgba(241,128,41,0.12)); pointer-events: none;"></div>
    <div style="position: relative; flex: 1; padding: 50px 68px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: 28px; width: auto;">
        <div style="display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(253,253,253,0.55);">
          <span>NTV-9034</span>
          <span style="width: 1px; height: 14px; background: rgba(253,253,253,0.25);"></span>
          <span id="clock">5:51 PM</span>
        </div>
      </div>

      <div style="flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; align-items: center;">
        <div style="display: flex; flex-direction: column; gap: 24px;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #F18029;">Keynote display</span>
          <h1 style="margin: 0; font-size: 52px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em;">Ready to pair with your dashboard</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.7; color: rgba(253,253,253,0.65); max-width: 420px;">Go to <strong style="color:#FDFDFD;">dashboard.ntv360.com</strong>, choose <strong style="color:#FDFDFD;">Screens &rarr; Add a display</strong>, and type the code shown here.</p>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
          <div style="display: flex; gap: 10px;">
            <div style="width: 68px; height: 84px; border-radius: 10px; background: rgba(253,253,253,0.06); border: 1px solid rgba(253,253,253,0.14); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800;">Z</div>
            <div style="width: 68px; height: 84px; border-radius: 10px; background: rgba(253,253,253,0.06); border: 1px solid rgba(253,253,253,0.14); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800;">5</div>
            <div style="width: 68px; height: 84px; border-radius: 10px; background: linear-gradient(135deg, #A00558, #EF060F 55%, #F18029); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800;">Y</div>
            <div style="width: 68px; height: 84px; border-radius: 10px; background: rgba(253,253,253,0.06); border: 1px solid rgba(253,253,253,0.14); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800;">1</div>
            <div style="width: 68px; height: 84px; border-radius: 10px; background: rgba(253,253,253,0.06); border: 1px solid rgba(253,253,253,0.14); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800;">C</div>
          </div>
          <div style="width: 130px; height: 130px; border-radius: 12px; background: #FDFDFD; padding: 10px;">
            <div style="width: 100%; height: 100%; border-radius: 6px; background: repeating-linear-gradient(45deg, #231F20 0 3px, #FDFDFD 3px 6px);"></div>
          </div>
          <span style="font-size: 12px; color: rgba(253,253,253,0.5); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em; text-transform: uppercase;">Or scan to pair</span>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(253,253,253,0.12); padding-top: 18px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84;"></span>
          <span style="font-size: 13px; color: rgba(253,253,253,0.6);">Player online</span>
        </div>
        <span style="font-size: 13px; color: rgba(253,253,253,0.5);">Code refreshes in 4:12</span>
      </div>
    </div>
  </div>
</div>
<script>
function fitCanvas() {
  var c = document.getElementById('canvas');
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var l = (window.innerWidth - 1280 * s) / 2;
  var t = (window.innerHeight - 720 * s) / 2;
  c.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
