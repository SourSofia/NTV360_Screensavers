<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV 360 — Split Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #00263E; overflow: hidden; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #FDFDFD; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }
  .canvas { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: top left; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="canvas" id="canvas">
  <div style="width: 1280px; height: 720px; display: flex; overflow: hidden; background: #00263E; color: #FDFDFD;">
    <div style="width: 50%; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; gap: 24px; position: relative;">
      <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: 28px; width: auto; position: absolute; top: 48px; left: 64px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #F18029;">Screen setup</span>
      <h1 style="margin: 0; font-size: 48px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;">Add this display to your account</h1>
      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 6px;">
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F18029;">01</span>
          <span style="font-size: 16px; color: rgba(253,253,253,0.85);">Visit dashboard.ntv360.com</span>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F18029;">02</span>
          <span style="font-size: 16px; color: rgba(253,253,253,0.85);">Go to Screens &rarr; Add a display</span>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F18029;">03</span>
          <span style="font-size: 16px; color: rgba(253,253,253,0.85);">Enter the code shown opposite</span>
        </div>
      </div>
    </div>
    <div style="width: 50%; background: linear-gradient(155deg, #A00558, #EF060F 55%, #F18029); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; position: relative;">
      <span style="position: absolute; top: 48px; right: 48px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.75);" id="clock">5:51 PM</span>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.85);">Pairing code</span>
      <div style="display: flex; gap: 10px;">
        <div style="width: 94px; height: 116px; border-radius: 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: #FDFDFD;">M</div>
        <div style="width: 94px; height: 116px; border-radius: 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: #FDFDFD;">8</div>
        <div style="width: 94px; height: 116px; border-radius: 10px; background: #FDFDFD; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: #00263E;">K</div>
        <div style="width: 94px; height: 116px; border-radius: 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: #FDFDFD;">3</div>
        <div style="width: 94px; height: 116px; border-radius: 10px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: #FDFDFD;">D</div>
      </div>
      <span style="font-size: 13px; color: rgba(255,255,255,0.75);">Expires in 4:20</span>
    </div>
  </div>
</div>
<script>
function fitCanvas() {
  var c = document.getElementById('canvas');
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var l = (window.innerWidth - 1280 * s) / 2;
  var t = (window.innerHeight - 720 * s) / 2;
  c.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
