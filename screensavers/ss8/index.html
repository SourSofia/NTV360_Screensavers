<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV 360 — Gradient Split</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #00263E; overflow: hidden; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #FDFDFD; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }
  .canvas { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: top left; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="canvas" id="canvas">
  <div style="width: 1280px; height: 720px; display: flex; overflow: hidden;">
    <div style="width: 46%; background: linear-gradient(160deg, #A00558, #EF060F 55%, #F18029); display: flex; flex-direction: column; justify-content: space-between; padding: 48px 44px; color: #FDFDFD;">
      <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: 28px; width: auto; filter: brightness(0) invert(1);">
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <h1 style="margin: 0; font-size: 46px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em;">Link this screen to your dashboard</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.9); max-width: 380px;">Visit <strong>dashboard.ntv360.com</strong>, open <strong>Screens &rarr; Add a display</strong>, then type the code shown opposite.</p>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.75);">Display ID &middot; NTV-7710</span>
    </div>
    <div style="width: 54%; background: #00263E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; position: relative;">
      <span style="position: absolute; top: 32px; right: 40px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(253,253,253,0.55);" id="clock">5:51 PM</span>
      <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(253,253,253,0.6);">Pairing code</span>
      <div style="display: flex; gap: 12px;">
        <div style="width: 72px; height: 88px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">V</div>
        <div style="width: 72px; height: 88px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">2</div>
        <div style="width: 72px; height: 88px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">F</div>
        <div style="width: 72px; height: 88px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">9</div>
        <div style="width: 72px; height: 88px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">H</div>
        <div style="width: 72px; height: 88px; border-radius: 10px; background: linear-gradient(135deg, #A00558, #EF060F 55%, #F18029); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FDFDFD;">4</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84;"></span>
        <span style="font-size: 13px; color: rgba(253,253,253,0.6);">Player online &middot; awaiting pairing</span>
      </div>
    </div>
  </div>
</div>
<script>
function fitCanvas() {
  var c = document.getElementById('canvas');
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var l = (window.innerWidth - 1280 * s) / 2;
  var t = (window.innerHeight - 720 * s) / 2;
  c.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
