<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTV 360 — Dashboard Pairing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/brand.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to menu</a>

  <main class="screen">
    <div class="blob blob--violet"></div>
    <div class="blob blob--red"></div>
    <div class="blob blob--orange"></div>

    <span class="glass-pill glass-pill--1"></span>
    <span class="glass-pill glass-pill--2"></span>
    <span class="glass-pill glass-pill--3"></span>

    <div class="stack">
      <img class="wordmark" src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" />

      <div class="screensaver-card">
        <span class="card__sheen"></span>

        <div class="card__body">
          <div class="card__text">
            <p class="instruction">Enter this code in your dashboard</p>
            <div class="code-display">GCZX4Y</div>
            <p class="timestamp">11:00 AM &middot; July 29, 2024</p>
          </div>

          <div class="card__qr">
            <img class="card__qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&amp;margin=0&amp;data=https%3A%2F%2Fdashboard.ntv360.com%2Fpair%3Fcode%3DGCZX4Y" alt="QR code to pair this player" width="150" height="150" />
            <p class="card__qr-label">or scan to pair</p>
          </div>
        </div>

        <div class="status-bar">
          <span class="status-dot"></span>
          <span>Player is Online</span>
        </div>
      </div>

      <ol class="steps">
        <li class="step">
          <span class="step__num">01</span>
          <span class="step__text">Visit <span class="step__highlight">dashboard.ntv360.com</span></span>
        </li>
        <li class="step">
          <span class="step__num">02</span>
          <span class="step__text">Go to <span class="step__highlight">Screens &rarr; Add a display</span></span>
        </li>
        <li class="step">
          <span class="step__num">03</span>
          <span class="step__text">Enter the six-character code</span>
        </li>
      </ol>
    </div>
  </main>
  <script src="../../assets/js/view-source.js"></script>
</body>
</html>
