<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NTV 360 — Full Gradient Wash</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #A00558; overflow: hidden; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #FDFDFD; opacity: 0.6; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }
  .stage {
    width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #A00558 0%, #EF060F 50%, #F18029 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 1.75rem; color: #FDFDFD;
  }
  @keyframes floatAurora { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,25px) scale(1.08); } 100% { transform: translate(25px,-30px) scale(0.95); } }
  .aurora { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .25; pointer-events: none; animation: floatAurora 20s ease-in-out infinite alternate; }
  .aurora-1 { top: -12%; right: -8%; width: 46%; height: 70%; background: radial-gradient(circle, #FDFDFD 0%, rgba(253,253,253,0) 70%); }
  .aurora-2 { bottom: -18%; left: -8%; width: 50%; height: 75%; background: radial-gradient(circle, #00263E 0%, rgba(0,38,62,0) 70%); animation-delay: -10s; }
  #particle-canvas { position: absolute; inset: 0; pointer-events: none; }
  .pin-tile {
    width: clamp(100px, 10vw, 190px);
    aspect-ratio: 0.82;
    border-radius: 18px;
    background: rgba(255,255,255,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(4rem, 7.2vw, 7.4rem);
    font-weight: 800;
    color: #00263E;
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="stage" id="stage">
  <canvas id="particle-canvas"></canvas>
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: clamp(24px, 2.6vw, 34px); width: auto; position: absolute; top: clamp(28px, 4.5vh, 44px); left: 50%; transform: translateX(-50%); filter: brightness(0) invert(1);">
  <span style="position: absolute; top: clamp(28px, 4.5vh, 48px); right: clamp(28px, 3.4vw, 56px); font-family: 'JetBrains Mono', monospace; font-size: clamp(0.7rem, 0.9vw, 0.85rem); color: rgba(255,255,255,0.85);" id="clock">5:51 PM</span>

  <span style="font-family: 'JetBrains Mono', monospace; font-size: clamp(0.7rem, 0.9vw, 0.85rem); letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700;">Pairing required</span>
  <h1 style="margin: 0; font-size: clamp(1.9rem, 3.2vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; max-width: 46vw; line-height: 1.1;">Enter this code at dashboard.ntv360.com</h1>

  <div style="display: flex; gap: clamp(0.5rem, 1vw, 0.85rem); margin-top: 0.4rem;">
    <div class="pin-tile">7</div>
    <div class="pin-tile">E</div>
    <div class="pin-tile">S</div>
    <div class="pin-tile pin-tile--accent">2</div>
    <div class="pin-tile">P</div>
    <div class="pin-tile">9</div>
  </div>

  <p style="margin: 0; font-size: clamp(0.8rem, 1vw, 0.95rem); color: rgba(255,255,255,0.85);">Screens &rarr; Add a display &middot; Code refreshes in 3:58</p>
</div>
<script>
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);

(function () {
  var c = document.getElementById('particle-canvas');
  var ctx = c.getContext('2d');
  var W, H, n = 26, pts = [];
  function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  for (var i = 0; i < n; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 1.8 + 1, a: Math.random() * 0.35 + 0.15 });
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < n; i++) {
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')'; ctx.fill();
      for (var j = i + 1; j < n; j++) {
        var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.strokeStyle = 'rgba(255,255,255,' + (0.1 * (1 - d / 120)) + ')'; ctx.lineWidth = 0.6; ctx.stroke(); }
      }
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
  <script src="../../assets/js/view-source.js"></script>
</body>
</html>
