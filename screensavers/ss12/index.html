<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }

  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #A00558; overflow: hidden; }

</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<div class="canvas" id="canvas">
  <div style="width: 1280px; height: 720px; background: linear-gradient(135deg, #A00558 0%, #EF060F 50%, #F18029 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; color: #FDFDFD;">
    <img src="../../assets/img/NTV_logo_gradient_horz_.png" alt="NTV 360" style="height: 34px; width: auto; position: absolute; top: 44px; left: 50%; transform: translateX(-50%); filter: brightness(0) invert(1);">

    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700;">Pairing required</span>
    <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; max-width: 700px; line-height: 1.1;">Enter this code at dashboard.ntv360.com</h1>

    <div style="display: flex; gap: 12px; margin-top: 6px;">
      <div style="width: 76px; height: 92px; border-radius: 14px; background: rgba(255,255,255,0.94); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #00263E;">7</div>
      <div style="width: 76px; height: 92px; border-radius: 14px; background: rgba(255,255,255,0.94); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #00263E;">E</div>
      <div style="width: 76px; height: 92px; border-radius: 14px; background: rgba(255,255,255,0.94); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #00263E;">S</div>
      <div style="width: 76px; height: 92px; border-radius: 14px; background: #00263E; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #FDFDFD;">2</div>
      <div style="width: 76px; height: 92px; border-radius: 14px; background: rgba(255,255,255,0.94); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #00263E;">P</div>
      <div style="width: 76px; height: 92px; border-radius: 14px; background: rgba(255,255,255,0.94); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #00263E;">9</div>

    <p style="margin: 0; font-size: 14px; color: rgba(255,255,255,0.85);">Screens &rarr; Add a display &middot; Code refreshes in 3:58</p>
  </div>
</div>
<script>
function fitCanvas() {
  var c = document.getElementById('canvas');
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var l = (window.innerWidth - 1280 * s) / 2;
  var t = (window.innerHeight - 720 * s) / 2;
  c.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
