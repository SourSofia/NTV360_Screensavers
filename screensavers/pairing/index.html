<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTV 360 — Player Pairing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/brand.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to menu</a>
  <button class="steps-toggle" id="steps-toggle" type="button">Hide steps</button>

  <main class="screen">
    <div class="bg"></div>
    <div class="bg bg--2"></div>
    <div class="bg bg--3"></div>

    <header class="wordmark">
      <img class="wordmark__logo" src="../../assets/img/NTV_logo_white_horz_.png" alt="NTV 360" />
    </header>

    <section class="pair-card">
      <div class="pair-card__text">
        <p class="pair-card__instruction">Enter this code in your dashboard</p>
        <p class="pair-card__code" id="pairing-code">GCZX4Y</p>
      </div>

      <div class="pair-card__divider"></div>

      <div class="pair-card__qr">
        <img class="pair-card__qr-img" id="pairing-qr" alt="QR code to pair this player" width="160" height="160" />
        <p class="pair-card__qr-label">or scan to pair</p>
      </div>
    </section>

    <ol class="steps" id="steps">
      <li class="step">
        <span class="step__badge">1</span>
        <span class="step__text">Visit <span class="step__highlight">dashboard.ntv360.com</span></span>
      </li>
      <li class="step">
        <span class="step__badge">2</span>
        <span class="step__text">Go to <span class="step__highlight">Screens &rarr; Add a display</span></span>
      </li>
      <li class="step">
        <span class="step__badge">3</span>
        <span class="step__text">Enter the code above</span>
      </li>
    </ol>

    <footer class="meta-bar">
      <span class="meta-bar__timestamp" id="pairing-timestamp">11:00 AM &middot; July 29, 2024</span>
      <span class="status">
        <span class="status__dot status__dot--online" id="status-dot"></span>
        <span class="status__text" id="status-text">PLAYER IS ONLINE</span>
      </span>
    </footer>
  </main>

  <script src="script.js"></script>
  <script src="../../assets/js/view-source.js"></script>
</body>
</html>
