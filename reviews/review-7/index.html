<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Review Billboard — Color Block</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .back-link { position: fixed; top: 16px; left: 16px; z-index: 100; color: #fff; opacity: 0.55; text-decoration: none; font-size: 14px; font-weight: 600; }
  .back-link:hover { opacity: 1; }

  @keyframes bb-fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes bb-fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes bb-twinkle { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.75; transform:scale(1.08); } }
  @keyframes bb-slideR { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #00263E;
    display: flex;
  }

  .block-violet { position: absolute; top: 0; right: 0; width: 27.1vw; height: 100%; background: #A00558; }
  .block-orange { position: absolute; top: 0; right: 27.1vw; width: 1.35vw; height: 100%; background: #F18029; }
  .block-red { position: absolute; bottom: 0; left: 0; width: 100%; height: 1.3vh; background: #EF060F; }

  .left {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10.2vh 4.7vw 12vh 5.7vw;
    box-sizing: border-box;
  }

  .rating-line { display: flex; align-items: center; gap: clamp(12px, 1.1vw, 22px); animation: bb-fadeIn 0.8s ease-out both; }
  .stars-row { font-size: clamp(24px, 4.1vh, 44px); letter-spacing: clamp(3px, 0.56vh, 6px); color: #F18029; animation: bb-twinkle 2.4s ease-in-out 1s infinite; }
  .rating-label { color: #898C8D; font-size: clamp(14px, 2vh, 22px); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }

  .quote {
    margin-top: clamp(24px, 4.1vh, 44px);
    font-size: clamp(30px, 6.1vh, 66px);
    line-height: 1.26;
    font-weight: 600;
    color: #FDFDFD;
    text-wrap: pretty;
    animation: bb-fadeUp 1.1s ease-out both;
  }

  .reviewer { margin-top: clamp(28px, 5.2vh, 56px); display: flex; align-items: center; gap: clamp(14px, 2.2vh, 24px); }

  .avatar {
    width: clamp(64px, 9.6vh, 104px);
    height: clamp(64px, 9.6vh, 104px);
    border-radius: 50%;
    overflow: hidden;
    background: #0b3b57;
    border: 4px solid #F18029;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar svg { width: 52%; height: 52%; fill: #CCCCCC; }

  .name { font-size: clamp(20px, 3.1vh, 34px); font-weight: 700; color: #FDFDFD; }
  .subtext { margin-top: clamp(4px, 0.6vh, 6px); font-size: clamp(14px, 2vh, 22px); color: #CCCCCC; font-weight: 600; }

  .right {
    position: relative;
    z-index: 3;
    width: 27.1vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 4.1vh, 44px);
    padding: 5.6vh 3.1vw;
    box-sizing: border-box;
    animation: bb-slideR 0.9s ease-out both;
  }

  .badge {
    background: #FDFDFD;
    border-radius: clamp(8px, 1.1vh, 12px);
    padding: clamp(10px, 1.7vh, 18px) clamp(18px, 1.8vw, 34px);
    display: flex;
    align-items: center;
    gap: clamp(6px, 0.6vw, 12px);
  }

  .badge-dot {
    width: clamp(20px, 3.1vh, 34px);
    height: clamp(20px, 3.1vh, 34px);
    border-radius: 50%;
    background: #00263E;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .badge-dot span { width: 44%; height: 44%; border-radius: 50%; border: 4px solid #F18029; }
  .badge-label { font-size: clamp(15px, 2.8vh, 30px); font-weight: 800; color: #00263E; letter-spacing: 1px; }

  .photo {
    width: 15.6vw;
    max-width: 300px;
    aspect-ratio: 1;
    border-radius: clamp(8px, 1.1vh, 12px);
    background: rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo svg { width: 42%; height: 42%; fill: rgba(255,255,255,0.6); }

  .contact { text-align: center; color: #FDFDFD; font-size: clamp(15px, 2vh, 22px); font-weight: 600; line-height: 1.7; }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">&larr; Back to menu</a>
<main class="scene">
  <div class="block-violet"></div>
  <div class="block-orange"></div>
  <div class="block-red"></div>

  <div class="left">
    <div class="rating-line">
      <div class="stars-row">&starf;&starf;&starf;&starf;&starf;</div>
      <div class="rating-label">5.0 &middot; Google Reviews</div>
    </div>

    <div class="quote">&ldquo;Absolutely wonderful experience! The service was exceptional and the atmosphere was perfect. Highly recommend to anyone looking for quality.&rdquo;</div>

    <div class="reviewer">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
      </div>
      <div>
        <div class="name">Sarah Johnson</div>
        <div class="subtext">Verified customer</div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="badge">
      <div class="badge-dot"><span></span></div>
      <div class="badge-label">LOGOIPSUM</div>
    </div>
    <div class="photo">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
    </div>
    <div class="contact">123 Main Street<br>City, State 12345<br>(555) 123-4567<br>www.yourbusiness.com</div>
  </div>
</main>
<script src="../../assets/js/view-source.js"></script>
</body>
</html>
